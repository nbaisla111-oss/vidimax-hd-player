name: vidimax_hd_player
description: "VidiMax HD Player - Complete All-in-One Offline Android Media Player with Secret Vault, Video to MP3, and Status Saver."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Media & Video Playback
  video_player: ^2.8.2
  chewie: ^1.7.5
  audioplayers: ^6.0.0
  video_thumbnail: ^0.5.6

  # Permissions & Android 13/14 Support
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0

  # File System & Storage
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Encryption for Private Vault
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Media Utilities & Sharing
  share_plus: ^9.0.0
  image_picker: ^1.1.0

  # UI & Design
  google_fonts: ^6.2.1
  flutter_staggered_animations: ^1.1.1
  smooth_page_indicator: ^1.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

dependency_overrides:
  package_info_plus: 8.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
