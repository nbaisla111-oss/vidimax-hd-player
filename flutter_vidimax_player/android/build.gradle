allprojects {
    repositories {
        google()
        mavenCentral()
    }
    ext {
        compileSdkVersion = 35
        targetSdkVersion = 35
        minSdkVersion = 24
        ndkVersion = "25.1.8937393"
        flutter = [
            compileSdkVersion: 35,
            minSdkVersion: 24,
            targetSdkVersion: 35,
            ndkVersion: "25.1.8937393"
        ]
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects { project ->
    project.ext.set("flutter", [
        compileSdkVersion: 35,
        minSdkVersion: 24,
        targetSdkVersion: 35,
        ndkVersion: "25.1.8937393"
    ])
    plugins.withId("com.android.library") {
        project.android {
            compileSdk = 35
            compileSdkVersion = 35
            ndkVersion = "25.1.8937393"
            if (namespace == null) {
                namespace = project.group.toString()
            }
            extensions.add("flutter", [
                compileSdkVersion: 35,
                minSdkVersion: 24,
                targetSdkVersion: 35,
                ndkVersion: "25.1.8937393"
            ])
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
