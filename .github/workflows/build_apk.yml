name: Build Android APK - VidiMax HD Player

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Export Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🩺 Flutter Doctor Check
        run: flutter doctor -v

      - name: 📦 Install Flutter Dependencies
        run: |
          cd flutter_vidimax_player
          flutter pub get

      - name: 🔨 Build Android Release APK
        run: |
          cd flutter_vidimax_player
          flutter build apk --release

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidiMax-HD-Player-Release-APK
          path: flutter_vidimax_player/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: 📋 Summary of Output
        run: |
          echo "### 🎉 Android APK Build Completed!" >> $GITHUB_STEP_SUMMARY
          echo "The APK has been successfully built and attached as an artifact in this workflow run." >> $GITHUB_STEP_SUMMARY
          echo "- **App:** VidiMax HD Player v1.0.0" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** Android (Release APK)" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** app-release.apk" >> $GITHUB_STEP_SUMMARY
