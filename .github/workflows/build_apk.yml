name: Build Android APK - VidiMax HD Player

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Export Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true

      - name: 🩺 Flutter Doctor Check
        run: flutter doctor -v

      - name: 📦 Install Flutter Dependencies
        run: |
          cd flutter_vidimax_player
          flutter clean
          flutter pub get

      - name: 🔨 Build Android Release APK
        run: |
          cd flutter_vidimax_player
          flutter build apk --release --no-tree-shake-icons

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VidiMax-HD-Player-Release-APK
          path: flutter_vidimax_player/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: 📋 Summary of Output
        if: always()
        run: |
          echo "### 🎉 Android APK Build Run Completed!" >> $GITHUB_STEP_SUMMARY
          echo "Check the Artifacts section above to download the APK file." >> $GITHUB_STEP_SUMMARY
