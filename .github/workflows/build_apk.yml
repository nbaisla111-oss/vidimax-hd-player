name: Build Signed Release AAB - Rox Player

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Export Signed Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true

      - name: 🔐 Decode Release Keystore & Write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing required signing secrets (KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > flutter_vidimax_player/android/app/upload-keystore.jks

          # Verify keystore can be unlocked by Java 17 keytool
          keytool -list \
            -keystore flutter_vidimax_player/android/app/upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null

          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > flutter_vidimax_player/android/key.properties

      - name: 🩺 Flutter Doctor Check
        run: flutter doctor -v

      - name: 📦 Install Flutter Dependencies
        run: |
          cd flutter_vidimax_player
          flutter clean
          flutter pub get

      - name: 🔨 Build Signed Android App Bundle (AAB)
        run: |
          cd flutter_vidimax_player
          flutter build appbundle --release --no-tree-shake-icons

      - name: ✅ Verify Release AAB Signature
        run: |
          AAB_FILE=$(ls -1 flutter_vidimax_player/build/app/outputs/bundle/release/*.aab | head -n 1)
          if [ ! -f "$AAB_FILE" ]; then
            echo "::error::Release AAB file not found!"
            exit 1
          fi
          echo "Verifying AAB: $AAB_FILE"
          SIGNER_INFO=$(jarsigner -verify -verbose -certs "$AAB_FILE")
          echo "$SIGNER_INFO" | grep -E "jar verified|>>> Signer|X\.509" | head -n 15 || true
          if echo "$SIGNER_INFO" | grep -qi "Android Debug"; then
            echo "::error::AAB is still signed with Android Debug key!"
            exit 1
          fi
          echo "✅ Verified: AAB is signed with Release Upload Keystore!"

      - name: 🧹 Clean Up Keystore Files
        if: always()
        run: |
          rm -f flutter_vidimax_player/android/app/upload-keystore.jks
          rm -f flutter_vidimax_player/android/key.properties

      - name: 🚀 Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rox-Player-Release-AAB
          path: flutter_vidimax_player/build/app/outputs/bundle/release/*.aab
          retention-days: 30

      - name: 📋 Summary of Output
        if: always()
        run: |
          echo "### 🎉 Signed Android App Bundle (.aab) Build Completed!" >> $GITHUB_STEP_SUMMARY
          echo "Download **Rox-Player-Release-AAB** from the Artifacts section to upload to Google Play Console." >> $GITHUB_STEP_SUMMARY
